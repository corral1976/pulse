stages:
  - build
  - test
  - release

variables:
  PACKAGE_NAME: "pulse-monitor"
  DEBIAN_FRONTEND: noninteractive

build:deb:
  stage: build
  image: debian:stable
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq dpkg-dev fakeroot
  script:
    - bash BUILD_DEB.sh
  artifacts:
    paths:
      - pulse-monitor_*.deb
    expire_in: 30 days
  only:
    - main
    - tags

lint:shell:
  stage: test
  image: debian:stable
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq shellcheck
  script:
    - shellcheck BUILD_DEB.sh
    - shellcheck debian/usr/bin/pulse
  allow_failure: true
  only:
    - main
    - merge_requests

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG
  only:
    - tags
  when: manual
